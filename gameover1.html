<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ゲームオーバー</title>

<style>

@font-face{
    font-family:'marumoji';
    src:url('marumoji.ttf');
}

body{
    font-family:'marumoji',sans-serif;
    padding:20px;
    text-align:center;
    line-height:1.8;
    font-size:22px;
}

video{
    width:100%;
    max-width:700px;
}

button{
    padding:12px 24px;
    border:none;
    border-radius:10px;
    font-size:22px;
    margin-top:15px;

}

#afterVideo{
    display:none;
    margin-top:25px;
}

</style>

</head>

<body>

<h2>

あ～あ…<ruby>信<rt>しん</rt></ruby>じてたのに…

</h2>


<video id="Video" controls>

<source src="bikkuribako.mp4" type="video/mp4">

</video>

<br>

<button onclick="showAfterVideo()">

<ruby>動画<rt>どうが</rt></ruby>を<ruby>見終<rt>みお</rt></ruby>わった

</button>

<div id="afterVideo">

<p>

なーんてね！びっくりした？？さすがに<ruby>殺<rt>ころ</rt></ruby>しはしないよ～！

<br><br>

うーん…<ruby>新参<rt>しんざん</rt></ruby>の君にはちょっと<ruby>難<rt>むずか</rt></ruby>しかったのかなー…

<br><br>

まあいいや、<ruby>悔<rt>くや</rt></ruby>しかったらあと10分あげるから<ruby>続<rt>つづ</rt></ruby>ければいいし、もう終わってもいいなら<ruby>諦<rt>あきら</rt></ruby>めるのボタンを押したらいいよ！


</p>

<button onclick="giveUp()">

サインボールは<ruby>諦<rt>あきら</rt></ruby>める

</button>

<br>

<button onclick="continueGame()">

<ruby>続<rt>つづ</rt></ruby>ける

</button>

</div>

<script>

function showAfterVideo(){

    document
    .getElementById(
        "afterVideo"
    )
    .style
    .display="block";

}

function giveUp(){

    location.href=
    "ending.html";

}

function continueGame(){

    localStorage.setItem(
        "extendMode",
        "1"
    );

    localStorage.setItem(
        "extendStart",
        Date.now()
    );

    const page=
    localStorage.getItem(
        "lastPage"
    );

    if(page){

        location.href=page;

    }else{

        location.href=
        "question1.html";

    }

}

</script>

</body>
</html>
