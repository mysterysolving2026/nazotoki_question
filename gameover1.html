<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ゲームオーバー</title>

<style>

@font-face{
    font-family:'marumoji';
    src:url('marumoji.ttf');
}

body{

    font-family:'marumoji',sans-serif;

    padding:20px;

    text-align:center;

    line-height:1.8;

    font-size:22px;

}

video{

    width:100%;
    max-width:700px;

}

button{

    padding:12px 24px;

    font-size:22px;

    margin-top:15px;

}

#afterVideo{

    display:none;

    margin-top:25px;

}

</style>

</head>

<body>

<h2>

あ～あ…

<ruby>
信
<rt>しん</rt></ruby>じてたのに…

</h2>


<video id="Video" controls>

<source src="bikkuribako.mp4" type="video/mp4">

</video>

<br>

<button onclick="showAfterVideo()">

<ruby>
動画
<rt>どうが</rt>
</ruby>
を
<ruby>
見終
<rt>みお</rt>
</ruby>
わった

</button>

<div id="afterVideo">

<p>

なーんてね！

びっくりした？？

さすがに
<ruby>
殺
<rt>ころ</rt>
</ruby>
しはしないよ～！

<br><br>

まあ
<ruby>
君
<rt>きみ</rt>
</ruby>
にはちょっと
<ruby>
難
<rt>むずか</rt>
</ruby>
しかったかもしれないし、

もう
<ruby>
終
<rt>お</rt>
</ruby>
わりたかったら、

チケットは
<ruby>
諦
<rt>あきら</rt>
</ruby>
めるのボタンを
<ruby>
押
<rt>お</rt>
</ruby>
してね。

<br><br>

でも
<ruby>
君
<rt>きみ</rt>
</ruby>
はあんなに
<ruby>
欲
<rt>ほ</rt>
</ruby>
しがってたものだし、

もしまだ
<ruby>
続
<rt>つづ</rt>
</ruby>
けたかったら、

<ruby>
特別
<rt>とくべつ</rt>
</ruby>
に
<ruby>
追加
<rt>ついか</rt>
</ruby>
で10
<ruby>
分
<rt>ぷん</rt>
</ruby>
あげるよ。

<br><br>

<ruby>
次
<rt>つぎ</rt>
</ruby>
こそは
<ruby>
絶対
<rt>ぜったい</rt>
</ruby>

<ruby>
解除
<rt>かいじょ</rt>
</ruby>
できるように
<ruby>
頑張
<rt>がんば</rt>
</ruby>
ってみてね♪

</p>

<button onclick="giveUp()">

チケットは
<ruby>
諦
<rt>あきら</rt>
</ruby>
める

</button>

<br>

<button onclick="continueGame()">

<ruby>
続
<rt>つづ</rt>
</ruby>
ける

</button>

</div>

<script>

function showAfterVideo(){

    document
    .getElementById(
        "afterVideo"
    )
    .style
    .display="block";

}

function giveUp(){

    location.href=
    "ending.html";

}

function continueGame(){

    localStorage.setItem(
        "extendMode",
        "1"
    );

    localStorage.setItem(
        "extendStart",
        Date.now()
    );

    const page=
    localStorage.getItem(
        "lastPage"
    );

    if(page){

        location.href=page;

    }else{

        location.href=
        "question1.html";

    }

}

</script>

</body>
</html>
